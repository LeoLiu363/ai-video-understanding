# 术语表：转写纠错 + 可疑术语标注
#
# 存在理由（真实事故）：
#   讲师说 uiautomator，ASR 听成 "URL to meta"。这个错字穿过切块、摘要、
#   章节笔记，最后在笔记里变成「使用工具 "URL to meta" 的功能查看 View 的布局结构」——
#   一个通顺、还被加了引号的错误结论。用户不会去怀疑一个通顺的句子。
#
# 两个清单的区别（重要）：
#   corrections  确定无误，自动替换。只有「能百分百确定讲师原话」的才放这里。
#   suspects     可疑但不确定，只标记、不替换，交人工确认。
#
# 宁可不改，也不要改错。改错了比不改更糟——通顺的错误最难发现。

version: 1

# ---------------------------------------------------------------- 确定替换
corrections:
  # uiautomator 被反复听成 "URL 相关词"。
  # 判定依据：同一段落里 OCR 抽到了截图左上角的 "UI Automator"，
  # 且后续出现了正确的 uiautomatorviewer.bat，可交叉印证。
  - wrong:
      - "URL to meta"
      - "URL to meter"
      - "URL to mete"
      - "url to meta"
    right: "uiautomator"
    reason: "ASR 把 uiautomator 听成 URL 相关词；OCR 截图可交叉印证"

  # 讲师用中文读 Base64（"贝斯六十四"）
  - wrong:
      - "贝斯六十四"
      - "贝斯 64"
    right: "Base64"
    reason: "中文口语读法，音译自 Base64"

  # 讲师说 "UTF-8 编码"，ASR 简写成 "U8 编码"
  - wrong:
      - "U8 编码"
      - "U8编码"
    right: "UTF-8 编码"
    reason: "ASR 把 UTF-8 缩成了 U8"

  # "目录下" 被听成 "闭目下"
  - wrong:
      - "闭目下"
    right: "目录下"
    reason: "ASR 错听，上下文讲的是在 SDK 目录下找 bat 文件"

# ---------------------------------------------------------------- 只标记不改
# 这些出现在笔记里会让人以为是事实，但无法确定正确写法，必须人工听原声。
suspects:
  # 讲师原话 "其实它用的是一个 D Y L two meter 是也是属于一个工具类"，
  # 空格字母序列是转写噪音的典型形态，但正确词无法从文本推断。
  #
  # 注意一个真实观察：重跑笔记时，模型自己把它猜成了 "dmtracedump" 并加注
  # 「转写中称 D Y L two meter」。猜得未必错，但**每次猜的不同、不可复现**——
  # 这正是必须由术语表做确定性处理的理由，也是这里只标记不替换的理由。
  - "D Y L two meter"
  # [09:06] "然后我们直接点这个 URL 分类" —— 与 "URL to meta" 属同一类误听，
  # 但此处上下文是「点击某个入口」，无法百分百确定原词，故只标记。
  - "URL分类"
  - "URL 分类"

# ---------------------------------------------------------------- 按课程
courses:
  "7aba99cf879083b7":
    suspects:
      # OCR 与转写里同一文件出现两种拼写（winco / wincon），必有一处错。
      # 不确定哪个对，交给人工。
      - "jeb_wincon_monitor.bat"
    trusted:
      # 本课反复出现且已核对无误
      - "com.kejian.one"
      - "kejian.one.utils.Encrypt"
      - "location.txt"

# ---------------------------------------------------------------- 白名单
# 确认无误的术语，避免被启发式规则误报。代码里已内置一份通用白名单，
# 这里只补充本项目特有的。
trusted:
  - "01关键代码定位.txt"
  - "EncryptStack"
  - "kechengProject"
  - "encryptstack"
  - "XSharedPreferences"
