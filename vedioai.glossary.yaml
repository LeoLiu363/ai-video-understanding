# 术语表：转写纠错 + 可疑术语标注
#
# 存在理由（真实事故）：
#   讲师说 uiautomator，ASR 听成 "URL to meta"。这个错字穿过切块、摘要、
#   章节笔记，最后在笔记里变成「使用工具 "URL to meta" 的功能查看 View 的布局结构」——
#   一个通顺、还被加了引号的错误结论。用户不会去怀疑一个通顺的句子。
#
# 两个清单的区别（重要）：
#   corrections  确定无误，自动替换。只有「能百分百确定讲师原话」的才放这里。
#   suspects     可疑但不确定，只标记、不替换，交人工确认。
#
# 宁可不改，也不要改错。改错了比不改更糟——通顺的错误最难发现。

version: 1

# ---------------------------------------------------------------- 确定替换
corrections:
  # uiautomator 被反复听成 "URL 相关词"。
  # 判定依据：同一段落里 OCR 抽到了截图左上角的 "UI Automator"，
  # 且后续出现了正确的 uiautomatorviewer.bat，可交叉印证。
  - wrong:
      - "URL to meta"
      - "URL to meter"
      - "URL to mete"
      - "url to meta"
    right: "uiautomator"
    reason: "ASR 把 uiautomator 听成 URL 相关词；OCR 截图可交叉印证"

  # 讲师用中文读 Base64（"贝斯六十四"）
  - wrong:
      - "贝斯六十四"
      - "贝斯 64"
    right: "Base64"
    reason: "中文口语读法，音译自 Base64"

  # 讲师说 "UTF-8 编码"，ASR 简写成 "U8 编码"
  - wrong:
      - "U8 编码"
      - "U8编码"
    right: "UTF-8 编码"
    reason: "ASR 把 UTF-8 缩成了 U8"

  # "目录下" 被听成 "闭目下"
  - wrong:
      - "闭目下"
    right: "目录下"
    reason: "ASR 错听，上下文讲的是在 SDK 目录下找 bat 文件"

# ---------------------------------------------------------------- 只标记不改
# 这些出现在笔记里会让人以为是事实，但无法确定正确写法，必须人工听原声。
suspects:
  # 讲师原话 "其实它用的是一个 D Y L two meter 是也是属于一个工具类"，
  # 空格字母序列是转写噪音的典型形态，但正确词无法从文本推断。
  #
  # 注意一个真实观察：重跑笔记时，模型自己把它猜成了 "dmtracedump" 并加注
  # 「转写中称 D Y L two meter」。猜得未必错，但**每次猜的不同、不可复现**——
  # 这正是必须由术语表做确定性处理的理由，也是这里只标记不替换的理由。
  #
  # 后续（adjudicate 判定）：文本模型依据一手转写推出 "Dalvik"（置信度 medium），
  # 理由是该句主语是 DDMS、而 DDMS 的全称是 Dalvik Debug Monitor。音节也对得上
  # （Dal-vik → "D Y L"；Debug Monitor → "two meter"）。但仍然只是推断，未采纳。
  - "D Y L two meter"
  # [09:06] "然后我们直接点这个 URL 分类" —— 与 "URL to meta" 属同一类误听，
  # 但此处上下文是「点击某个入口」，无法百分百确定原词，故只标记。
  #
  # 后续（adjudicate 判定）：文本模型明确回「无 OCR 佐证、不猜」，保持存疑。
  # 可参考的画面证据：同一时刻的课件显示 uiautomatorviewer 窗口已打开。
  - "URL分类"
  - "URL 分类"

# ---------------------------------------------------------------- 按课程
courses:
  "7aba99cf879083b7":
    suspects:
      # 这个文件名**无法从材料里确定**，原因很具体：
      #
      # 画面上的文件名被 Windows 资源管理器自己截断了，显示为
      #     jeb_winco...monitor.bat
      # 那个 "..." 是系统的省略号，不是 OCR 的错。判别真伪的那个字符
      # （n）**根本没渲染到屏幕上**，所以 OCR 再准也读不到它。
      # 高清重跑 OCR 后依然是 "jeb_winco...monitor.bat"（128 次），并未变清晰——
      # 这正好印证：瓶颈在画面本身，不在识别能力。
      #
      # 已排除的一种猜想：不是 OCR 吃掉了 n。用同一套 OCR 把两种候选写法渲染成
      # 11px 小字（甚至再缩一半）去测，wincon 与 winco 都能逐字读对。
      #
      # 现有线索指向 wincon，但属于**外部知识**而非材料证据，故不自动替换：
      #   JEB 官方只发布 jeb_wincon.bat（wincon = Windows Console），
      #   从未有过 jeb_winco_monitor.bat 这个文件。
      # 要定论，得看讲师本机的 jeb 目录——那是材料之外的信息。
      #
      # 注意：该字符串只出现在**摘要**里；画面 OCR 里只有被截断的形式。
      # 而摘要不能当证据（LLM 可能已把它合理化），所以判定工具回「不确定」是对的。
      - "jeb_wincon_monitor.bat"
      - "jeb_winco_monitor.bat"
      - "jeb_winco...monitor.bat"
    trusted:
      # 本课反复出现且已核对无误
      - "com.kejian.one"
      - "kejian.one.utils.Encrypt"
      - "location.txt"

