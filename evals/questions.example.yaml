# ============================================================================
# 评估集 · 完整示例（假设的课程，仅用于说明格式）
#
# 你的真实评估集请复制本文件为 questions.yaml 并替换内容。
# 也可以先跑 `vedioai eval --scaffold <video_id>` 自动生成带章节结构的骨架。
#
# 评分规则见 evals/SCORING.md —— 关键点：expect_keypoints 支持
# 「字符串」与「字符串数组（任一命中即可）」两种写法。
# ============================================================================

version: 1

course:
  video_id: "REPLACE_ME"
  title: "数据结构与算法 · 第 3 讲 排序"
  notes: "纯口播课（无 PPT），时长约 1 小时 50 分"

# 笔记评估：从课程里挑 10 条最该被写进学习文档的结论
notes_expected:
  - "插入排序平均时间复杂度 O(n²)，在近乎有序的数据上接近 O(n)"
  - "归并排序时间复杂度稳定为 O(n log n)，但需要 O(n) 额外空间"
  - "快速排序平均 O(n log n)，最坏 O(n²)，可通过随机化基准元素规避"
  - "堆排序原地排序，空间 O(1)，但不稳定"
  - "比较排序的下界是 Ω(n log n)"
  - "计数排序不是比较排序，可以突破下界，但要求键值范围有限"
  - "稳定性指相等元素的相对顺序是否保持不变"
  - "Java 的 Arrays.sort 对基本类型用双轴快排，对对象用归并（Timsort）"
  - "工程中很少直接手写排序，但要理解选型依据"
  - "海量数据排序要注意外部排序与分块归并"

questions:
  # ---------------------------------------------------------------- 事实型
  - id: f01
    type: factual
    question: "老师讲的插入排序，在数组已经基本有序的情况下复杂度是多少？"
    expect_keypoints:
      - "接近 O(n)"
      - ["最好情况", "最优情况"]
    expect_time: "08:20"
    tolerance_ms: 90000

  - id: f02
    type: factual
    question: "快速排序最坏情况的时间复杂度是多少？老师给出了什么规避办法？"
    expect_keypoints:
      - ["O(n²)", "O(n^2)", "平方"]
      - ["随机化", "随机选", "随机基准", "打乱"]
    expect_time: "41:00"
    tolerance_ms: 120000

  - id: f03
    type: factual
    question: "堆排序的空间复杂度是多少？"
    expect_keypoints:
      - ["O(1)"]
      - ["原地", "就地"]

  # ------------------------------------------------------------ 跨段聚合型
  - id: c01
    type: cross
    question: "老师一共分析了哪几种排序算法的稳定性？分别是什么结论？"
    expect_keypoints:
      - ["插入排序"]
      - ["归并排序"]
      - ["快速排序"]
      - ["堆排序"]
      - ["不稳定"]
    expect_time: "52:30"
    tolerance_ms: 300000

  - id: c02
    type: cross
    question: "哪些排序算法是原地排序？哪些需要额外空间？请汇总。"
    expect_keypoints:
      - ["堆排序"]
      - ["快速排序"]
      - ["归并排序"]
      - ["O(n)"]

  # ---------------------------------------------------------------- 视觉型
  - id: v01
    type: visual
    question: "老师在白板上画的那张递归调用树，第三层的数组区间是怎么划分的？"
    expect_keypoints:
      - ["递归"]
      - ["划分"]
    expect_time: "35:10"
    tolerance_ms: 120000

  - id: v02
    type: visual
    question: "屏幕上那张复杂度对比表里，O(n log n) 那一行对应哪几种算法？"
    expect_keypoints:
      - ["归并"]
      - ["堆排序"]
      - ["快速排序"]

  # ---------------------------------------------------------------- 全局型
  - id: g01
    type: global
    question: "这门课一共讲了几种排序算法？请列出。"
    expect_keypoints:
      - ["插入排序"]
      - ["归并排序"]
      - ["快速排序"]
      - ["堆排序"]
      - ["计数排序"]

  - id: g02
    type: global
    question: "老师对「工程中是否需要手写排序」的态度是什么？他在课程中前后的说法一致吗？"
    expect_keypoints:
      - ["不需要", "很少", "不必"]
      - ["理解选型", "明白原理", "知道怎么选"]
    expect_time: "100:00"
    tolerance_ms: 600000
