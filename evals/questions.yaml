# ============================================================================
# 评估集 · Android关键代码定位与加密分析
#
# video_id: 7aba99cf879083b7（31:28，PPT 为主的技术课）
# 出题依据：真实转写（228 句）+ 课件 OCR（138 张），非凭空编写。
# 评分标准见 evals/SCORING.md
#
# 覆盖：factual 10 / cross 10 / visual 10 / global 10 = 40 题
# 视觉题刻意依赖课件截图内容（resource-id、代码、属性面板），用于检验 OCR 是否真的生效。
# ============================================================================

version: 1

course:
  video_id: "7aba99cf879083b7"
  title: "Android关键代码定位与加密分析"
  notes: "PPT + 实操演示为主；大量关键信息在课件截图与 IDE 界面上，教学录像同时含投屏与录屏工具画面"

# 写法说明：每条 = 一个「应写进学习文档的结论」，用数组给出该结论的多种关键写法，
# 命中任一写法即算该条命中（判定口径同 expect_keypoints）。
# 不要写成完整长句——评分是「整串连续出现」，长句必然失配（见 runs 第一版 notes_hit=0 的教训）。
# 判定词刻意选「具体、易漏」的数值/术语，而非高频名词，否则每条都命中、没有区分度。
notes_expected:
  - ["一共四种", "共四种", "四种方式", "四种方法", "4种", "四种"]
  - ["654321"]
  - ["0102030405060708"]
  - ["MTIzNA", "MTIzNA=="]
  - ["296506"]
  - ["PKCS5Padding", "AES/CBC"]
  - ["EncryptStack"]
  - ["InfiniteLog"]
  - ["requestLegacyExternalStorage", "LegacyExternalStorage"]
  - ["不可见字符", "不可见字符串"]

questions:
