<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vedioAI · 课程视频 AI 理解</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #98a2b3; --accent: #4f8cff; --accent-2: #34d399;
    --warn: #fbbf24; --err: #f87171;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge.ok { color: var(--accent-2); border-color: #1f4d3a; }
  .badge.bad { color: var(--warn); border-color: #4d411f; }

  main {
    --w-lib: 260px;
    --w-ai: 560px;
    display: grid;
    /* 课程库 | 拖条 | 播放器 | 拖条 | AI —— AI 默认更宽，拖条可再拉 */
    grid-template-columns: var(--w-lib) 5px minmax(280px, 1fr) 5px var(--w-ai);
    min-height: 0;
  }
  .col { min-height: 0; overflow-y: auto; border-right: none; }
  .col-head {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
  }
  .pad { padding: 12px 14px; }

  /* 列宽拖动手柄 */
  .splitter {
    position: relative; z-index: 3;
    background: var(--line); cursor: col-resize;
    transition: background .15s;
  }
  .splitter::after {
    content: ""; position: absolute; inset: 0 -3px; /* 扩大可点区域 */
  }
  .splitter:hover, .splitter.dragging { background: var(--accent); }
  body.col-resizing { cursor: col-resize; user-select: none; }
  body.col-resizing * { cursor: col-resize !important; }

  input, textarea, button, select {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px;
  }
  input:focus, textarea:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; min-width: 0; }

  .lib-item {
    padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .lib-item:hover { background: var(--panel-2); }
  .lib-item.active { background: #1b2434; border-left: 3px solid var(--accent); }
  .lib-item .t { font-weight: 600; font-size: 13px; }
  .lib-item .m { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .player-wrap { background: #000; }
  video { width: 100%; max-height: 46vh; display: block; background: #000; }
  .player-meta {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  .player-meta strong { color: var(--text); font-size: 13px; font-weight: 600; }

  .chapter {
    display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .chapter:hover { background: var(--panel-2); }
  .chapter .ts { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; flex: 0 0 auto; }
  .chapter .tt { font-size: 13px; }
  .chapter .sm { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: pre-wrap; }

  .msg { padding: 10px 12px; border-radius: var(--radius); margin-bottom: 12px; }
  .msg.user { background: #1b2434; margin-left: 24px; }
  .msg.ai { background: var(--panel-2); }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: .5px; }
  /* 正文是 HTML（标题/表格/列表），不能用 pre-wrap，否则表格单元格会被挤成一字一行 */
  .msg .body { word-break: normal; overflow-wrap: anywhere; }
  .msg .body pre {
    background: #0b0e13; padding: 10px; border-radius: 8px; overflow-x: auto;
    border: 1px solid var(--line); white-space: pre;
  }
  .msg .body code { background: #0b0e13; padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .meta-line { color: var(--muted); font-size: 11.5px; margin-top: 8px; }

  .session-bar {
    display: flex; gap: 4px; align-items: center; margin-bottom: 10px;
  }
  .session-bar select {
    flex: 1; min-width: 0; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px;
  }
  .session-bar button { padding: 5px 9px; font-size: 13px; line-height: 1; }
  #chat { max-height: 52vh; overflow: auto; margin-bottom: 8px; }

  .ts-link {
    color: var(--accent); cursor: pointer; text-decoration: underline dotted;
    font-variant-numeric: tabular-nums;
  }
  .ts-link:hover { color: #7eaaff; }
  .cites { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .cite { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .cite .txt { color: #c3cad8; }

  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { height: 84px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }

  .progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .status-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .err { color: var(--err); font-size: 12.5px; }
  .notes-out {
    white-space: pre-wrap; background: #0b0e13; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; font-size: 13px; max-height: 40vh; overflow: auto;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 5px 12px; font-size: 12.5px; border-radius: 999px; }
  .tabs button.on { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }

  .dropzone {
    margin-top: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px;
    text-align: center; color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .dropzone.drag { border-color: var(--accent); color: var(--accent); background: #121820; }
  .lib-item { position: relative; }
  .lib-item .del {
    position: absolute; right: 8px; top: 8px; opacity: 0; padding: 2px 6px; font-size: 12px;
  }
  .lib-item:hover .del { opacity: 1; }
  .series-head {
    padding: 8px 12px 4px; font-size: 11px; color: var(--muted); letter-spacing: .4px;
    text-transform: none; border-top: 1px solid var(--line);
  }
  .series-ask {
    display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  .series-ask input { flex: 1; min-width: 0; }

  .player-tools { display: flex; gap: 4px; padding: 8px 12px 0; }
  .player-tools button { padding: 4px 10px; font-size: 12px; border-radius: 999px; }
  .player-tools button.on { background: var(--accent); color: #06101f; border-color: var(--accent); }
  #transcript, #search-panel {
    max-height: 28vh; overflow: auto; padding: 8px 12px 12px; font-size: 13px;
  }
  .seg-line {
    padding: 4px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px;
  }
  .seg-line:hover { background: var(--panel-2); }
  .seg-line.active { background: #1a2434; outline: 1px solid var(--accent); }
  .seg-line .ts { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 48px; }
  .seg-line.selected { background: #2a2210; }
  .search-bar { display: flex; gap: 6px; padding: 0 12px 8px; }
  .search-bar input { flex: 1; }
  .fix-bar {
    display: none; gap: 6px; align-items: center; padding: 6px 12px;
    background: #1a1810; border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .fix-bar.show { display: flex; }
  .fix-bar input { width: 120px; }

  /* ------------------------------------------------ 渲染后的 Markdown */
  .md { font-size: 14px; }
  .md > *:first-child { margin-top: 0; }
  .md h1 { font-size: 22px; margin: 20px 0 10px; }
  .md h2 { font-size: 18px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 15px; margin: 16px 0 8px; color: #cdd6e4; }
  .md h4, .md h5, .md h6 { font-size: 14px; margin: 12px 0 6px; color: var(--muted); }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote {
    margin: 8px 0; padding: 4px 0 4px 12px; border-left: 3px solid var(--line);
    color: var(--muted);
  }
  /* 助教「拓展」段落：和课内结论视觉上分开，避免被当成视频原话 */
  .md blockquote.ext {
    border-left-color: var(--warn);
    color: var(--text);
    background: #1a1810;
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
  }
  .md blockquote.ext strong:first-child { color: var(--warn); }
  .md code { background: #0b0e13; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .md pre {
    background: #0b0e13; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
    border: 1px solid var(--line);
  }
  .md pre code { background: none; padding: 0; }
  .md a { color: var(--accent); }
  .md-table-wrap {
    overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px;
    max-width: 100%;
  }
  /* max-content：内容决定列宽，窄栏时横向滚动，而不是把字挤成一列 */
  .md table {
    border-collapse: collapse; width: max-content; min-width: 100%; font-size: 13px;
  }
  .md th, .md td {
    border-bottom: 1px solid var(--line); padding: 7px 10px;
    text-align: left; vertical-align: top;
    white-space: normal; word-break: normal; overflow-wrap: anywhere;
  }
  .md th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }
  .md tr:last-child td { border-bottom: none; }
  .md td { min-width: 7em; }
  .md td:first-child { min-width: 9em; max-width: 16em; }
  .md strong { color: #fff; }

  /* 时间标注：`> 时间 00:55` 与表格里的整格时间 */
  .ts-chip {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    background: #1b2434; border: 1px solid #2c3b55; color: var(--accent);
    font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .ts-chip:hover { border-color: var(--accent); color: #7eaaff; }

  /* ------------------------------------------------ 全屏阅读视图 */
  .reader {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: grid; grid-template-rows: auto 1fr;
  }
  .reader-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .reader-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .reader-body {
    display: grid; grid-template-columns: 280px minmax(0, 1fr);
    min-height: 0;
  }
  .reader-toc {
    overflow-y: auto; border-right: 1px solid var(--line);
    padding: 10px 6px 40px; background: var(--panel);
  }
  .reader-toc .grp {
    font-size: 11px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); padding: 10px 10px 4px;
  }
  .reader-toc a {
    display: block; padding: 5px 10px; border-radius: 6px; color: var(--text);
    text-decoration: none; font-size: 12.5px; line-height: 1.4;
    border-left: 2px solid transparent;
  }
  .reader-toc a.sub { padding-left: 22px; color: var(--muted); font-size: 12px; }
  .reader-toc a:hover { background: var(--panel-2); }
  .reader-toc a.on { background: #1b2434; border-left-color: var(--accent); color: #fff; }
  .reader-content { overflow-y: auto; padding: 26px 40px 120px; }
  .reader-content .inner { max-width: 900px; margin: 0 auto; }
  .reader-empty { max-width: 560px; margin: 60px auto; text-align: center; }

  /* ------------------------------------------------ 用量账本 */
  .usage-sec { margin-top: 16px; }
  .usage-h {
    font-size: 11px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .usage-big { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .usage-big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .usage-card {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .usage-row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px;
  }
  .usage-row:last-child { border-bottom: none; }
  .usage-row .n { color: var(--muted); }
  .usage-row .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .usage-row .v.warn { color: var(--warn); }
  .usage-tag {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: 6px;
  }
  .usage-tag.peak { color: var(--warn); border-color: #4d411f; }
</style>
</head>
<body>
<header>
  <h1>vedioAI</h1>
  <span class="hint">课程视频 AI 理解 · 本地转写索引 + 云端问答</span>
  <span class="spacer"></span>
  <span id="badge-asr" class="badge">ASR ?</span>
  <span id="badge-llm" class="badge">LLM ?</span>
  <span id="badge-vision" class="badge">视觉 ?</span>
  <span id="badge-local" class="badge">本地模型 ?</span>
</header>

<main>
  <!-- ---------------------------------------------------------- 课程库 -->
  <section class="col" id="col-lib">
    <div class="col-head">课程库</div>
    <div class="pad">
      <div class="row">
        <input id="ingest-path" placeholder="粘贴本地视频完整路径，如 D:\courses\a.mp4" />
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="btn-ingest" style="flex:1">入库</button>
        <label class="ghost" style="padding:8px 12px;cursor:pointer;border:1px solid var(--line);border-radius:8px">
          选文件<input type="file" id="ingest-file" accept="video/*,.mkv,.flv,.ts" hidden />
        </label>
        <button class="ghost" id="btn-refresh" title="刷新">刷新</button>
      </div>
      <div id="dropzone" class="dropzone">也可把视频拖到这里（填入本机路径）</div>
      <div id="ingest-progress" class="hidden" style="margin-top:10px">
        <div class="progress"><i id="ingest-bar"></i></div>
        <div class="status-line" id="ingest-status"></div>
      </div>
      <div id="ingest-error" class="err" style="margin-top:6px"></div>
    </div>
    <div id="series-ask-bar" class="series-ask hidden">
      <input id="series-q" placeholder="对本系列跨课提问…" />
      <button class="ghost" id="btn-series-ask">跨课问</button>
    </div>
    <div id="library"></div>
  </section>

  <div class="splitter" id="split-lib" title="拖动调整课程库宽度"></div>

  <!-- ---------------------------------------------------------- 播放器 -->
  <section class="col" id="col-player">
    <div class="player-wrap">
      <video id="player" controls preload="metadata">
        <track id="subtitle-track" kind="subtitles" srclang="zh" label="转写" default />
      </video>
    </div>
    <div class="player-meta">
      <strong id="video-title">未选择课程</strong>
      <span id="video-duration"></span>
      <span class="spacer" style="flex:1"></span>
      <span id="player-clock"></span>
    </div>
    <div class="player-tools">
      <button id="tab-chapters" class="on">章节</button>
      <button id="tab-transcript">转写</button>
      <button id="tab-search">搜索</button>
    </div>
    <div id="fix-bar" class="fix-bar">
      <span>纠正选中词：</span>
      <code id="fix-wrong"></code>
      <span>→</span>
      <input id="fix-right" placeholder="正确写法" />
      <button class="primary" id="btn-fix-apply">写入术语表</button>
      <button class="ghost" id="btn-fix-cancel">取消</button>
    </div>
    <div id="panel-chapters">
      <div id="chapters" class="pad hint">入库完成后显示章节。</div>
    </div>
    <div id="panel-transcript" class="hidden">
      <div id="transcript" class="hint">打开课程后显示同步转写。</div>
    </div>
    <div id="panel-search" class="hidden">
      <div class="search-bar">
        <input id="search-q" placeholder="课内关键词…" />
        <button class="ghost" id="btn-search">搜索</button>
      </div>
      <div id="search-panel" class="hint">输入关键词查找本课转写。</div>
    </div>
  </section>

  <div class="splitter" id="split-ai" title="拖动调整 AI 面板宽度"></div>

  <!-- ---------------------------------------------------------- AI 面板 -->
  <section class="col" id="col-ai">
    <div class="col-head">
      <span>AI 助手</span>
    </div>
    <div class="pad">
      <div class="tabs" style="margin-bottom:10px">
        <button id="tab-ask" class="on">问答</button>
        <button id="tab-notes">学习文档</button>
        <button id="tab-usage">用量</button>
      </div>

      <!-- 问答 -->
      <div id="panel-ask">
        <div class="session-bar">
          <select id="session-select" title="切换会话"></select>
          <button class="ghost" id="btn-session-new" title="新建会话">＋</button>
          <button class="ghost" id="btn-session-rename" title="重命名">✎</button>
          <button class="ghost" id="btn-session-archive" title="归档当前会话">🗄</button>
        </div>
        <div id="chat"></div>
        <textarea id="question" rows="3" placeholder="就这门课提问，例如：老师讲的三种排序分别是什么？"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary" id="btn-ask" style="flex:1">提问</button>
          <label class="hint" style="display:flex;align-items:center;gap:4px">
            <input type="checkbox" id="use-position" /> 附带当前进度
          </label>
        </div>
      </div>

      <!-- 学习文档 -->
      <div id="panel-notes" class="hidden">
        <p class="hint">按章节分层生成学习笔记（Markdown），每节带时间锚点。</p>
        <button class="primary" id="btn-notes">生成学习文档</button>
        <div class="row" style="margin-top:10px">
          <button class="primary hidden" id="btn-read">全屏阅读</button>
        </div>
        <div id="notes-progress" class="hidden" style="margin-top:10px">
          <div class="progress"><i id="notes-bar"></i></div>
          <div class="status-line" id="notes-status"></div>
        </div>
        <p class="hint" id="notes-empty" style="margin-top:10px"></p>
        <div id="notes-out" class="notes-out hidden" style="margin-top:10px"></div>
      </div>

      <!-- 用量账本 -->
      <div id="panel-usage" class="hidden">
        <div id="usage-current"></div>
        <div class="usage-sec">
          <div class="usage-h">全局用量</div>
          <div id="usage-global" class="hint">加载中…</div>
        </div>
        <div class="usage-sec">
          <div class="usage-h">按用途</div>
          <div id="usage-kind" class="hint"></div>
        </div>
        <div class="usage-sec">
          <div class="usage-h">按课程</div>
          <div id="usage-video" class="hint"></div>
        </div>
        <div class="usage-sec">
          <div class="usage-h">计价说明</div>
          <div id="usage-price" class="hint"></div>
        </div>
        <button class="ghost" id="btn-usage-refresh" style="margin-top:10px">刷新</button>
      </div>
    </div>
  </section>
</main>

<!-- ------------------------------------------------------------ 阅读视图 -->
<div id="reader" class="reader hidden">
  <div class="reader-head">
    <h2 id="reader-title">学习文档</h2>
    <span class="hint" id="reader-meta"></span>
    <span class="spacer" style="flex:1"></span>
    <button class="ghost" id="reader-regen">重新生成</button>
    <button class="ghost" id="reader-download">下载 Markdown</button>
    <button class="primary" id="reader-close">回到播放器</button>
  </div>
  <div class="reader-body">
    <nav class="reader-toc" id="reader-toc"></nav>
    <div class="reader-content" id="reader-content"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let current = null;       // 当前课程的详情
let currentId = null;
let currentSessionId = null;
let pollTimer = null;

/* ---------------------------------------------------------------- 工具 */

function fmt(ms) {
  const total = Math.max(0, Math.floor((ms || 0) / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function seek(ms) {
  const v = $("player");
  if (!v.src) return;
  v.currentTime = Math.max(0, ms / 1000);
  v.play().catch(() => {});
  v.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** Markdown 渲染：标题层级、表格、列表、引用、分隔线、代码块、行内格式。
 *
 * 旧实现只把 `#`/`##`/`###` 统统换成 <strong>，于是 23 章文档变成一整块粗体，
 * 468 行表格显示成裸 `|`。笔记这种东西，结构就是内容，不能糊。
 *
 * 顺序很重要：先摘出代码块（免得其中的 `|`、`#` 被当成语法），再按行扫描块级
 * 元素，最后统一处理行内格式。
 */
const TS_RE = /\b(\d{1,3}):([0-5]\d)\b/;

function mdInline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

/** 整格就是一个时间（`| 00:55 |`）时渲染成可点的时间胶囊。 */
function tsChip(text) {
  const m = /^\s*(\d{1,3}):([0-5]\d)\s*$/.exec(text);
  if (!m) return null;
  const ms = (Number(m[1]) * 60 + Number(m[2])) * 1000;
  return `<span class="ts-chip ts-link" data-ms="${ms}">${m[1].padStart(2, "0")}:${m[2]}</span>`;
}

function renderMarkdown(src) {
  const lines = String(src ?? "").replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;

  const splitRow = (row) =>
    row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());

  while (i < lines.length) {
    const line = lines[i];

    // 围栏代码块
    if (/^\s*```/.test(line)) {
      const lang = line.trim().slice(3).trim();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++; // 收尾 ```
      out.push(
        `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ""}>${esc(body.join("\n"))}</code></pre>`
      );
      continue;
    }

    // 表格：当前行是 |...|，下一行是 |---|---|
    if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      const th = head.map((c) => `<th>${mdInline(c)}</th>`).join("");
      const tb = rows
        .map(
          (r) =>
            `<tr>${head
              .map((_, n) => {
                const cell = r[n] ?? "";
                return `<td>${tsChip(cell) ?? mdInline(cell)}</td>`;
              })
              .join("")}</tr>`
        )
        .join("");
      out.push(`<div class="md-table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`);
      continue;
    }

    // 分隔线
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      out.push("<hr>");
      i++;
      continue;
    }

    // 标题
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      const lvl = h[1].length;
      out.push(`<h${lvl}>${mdInline(h[2].trim())}</h${lvl}>`);
      i++;
      continue;
    }

    // 引用：`> 时间 00:55` 特判成时间胶囊（这是笔记里 114 处跳转锚点）
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      const text = buf.join(" ").trim();
      const m = /^时间\s*(.+)$/.exec(text);
      if (m && TS_RE.test(m[1])) {
        out.push(
          m[1]
            .split(/[、,，\s]+/)
            .filter(Boolean)
            .map((t) => {
              const t2 = /^(\d{1,3}):([0-5]\d)$/.exec(t);
              if (!t2) return mdInline(t);
              const ms = (Number(t2[1]) * 60 + Number(t2[2])) * 1000;
              return `<div><span class="ts-chip ts-link" data-ms="${ms}">${t2[1].padStart(2, "0")}:${t2[2]}</span></div>`;
            })
            .join("")
        );
      } else {
        const isExt = /^\*\*拓展\*\*/.test(text) || /^拓展\b/.test(text);
        out.push(
          `<blockquote class="${isExt ? "ext" : ""}">${mdInline(text)}</blockquote>`
        );
      }
      continue;
    }

    // 列表
    if (/^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (
        i < lines.length &&
        (/^\s*[-*+]\s+/.test(lines[i]) || /^\s*\d+[.)]\s+/.test(lines[i]))
      ) {
        items.push(lines[i].replace(/^\s*(?:[-*+]|\d+[.)])\s+/, ""));
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${mdInline(t)}</li>`).join("")}</${tag}>`);
      continue;
    }

    // 空行
    if (!line.trim()) {
      i++;
      continue;
    }

    // 段落（合并到空行或下一个块级起点）
    const para = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^\s*(#{1,6}\s|>|```|\||[-*+]\s|\d+[.)]\s)/.test(lines[i]) &&
      !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])
    ) {
      para.push(lines[i++]);
    }
    out.push(`<p>${mdInline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

/** 兜底：正文里的 [MM:SS] / [时间 MM:SS] 也变成可点时间戳。 */
function linkifyTimestamps(html) {
  return html.replace(/\[(?:时间\s*)?(\d{1,2}:\d{2}(?::\d{2})?)\]/g, (m, ts) => {
    const parts = ts.split(":").map(Number);
    while (parts.length < 3) parts.unshift(0);
    const ms = ((parts[0] * 60 + parts[1]) * 60 + parts[2]) * 1000;
    return `<span class="ts-link" data-ms="${ms}">[${ts}]</span>`;
  });
}

/** 一次到位：渲染 + 时间戳可点。聊天与阅读都包一层 .md，表格/标题样式才能生效。 */
function md(text) {
  return `<div class="md">${linkifyTimestamps(renderMarkdown(text))}</div>`;
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

/* ---------------------------------------------------------------- 健康 */

async function loadHealth() {
  try {
    const h = await api("/api/health");
    const set = (id, ok, label) => {
      const el = $(id);
      el.textContent = `${label} ${ok ? "OK" : "未配置"}`;
      el.className = "badge " + (ok ? "ok" : "bad");
    };
    set("badge-asr", h.asr_ready, "ASR");
    set("badge-llm", h.llm_ready, "LLM");
    set("badge-vision", h.vision_ready, "视觉");
    set("badge-local", h.embedder || h.reranker, "本地模型");
  } catch (e) { /* 服务还没起好 */ }
}

/* ---------------------------------------------------------------- 课程库 */

let currentSeriesId = null;
let transcriptSegs = [];

async function loadLibrary() {
  const data = await api("/api/library");
  const box = $("library");
  if (!data.items.length) {
    box.innerHTML = `<div class="pad hint">课程库为空。粘贴路径、选文件或拖拽后点「入库」。</div>`;
    $("series-ask-bar").classList.add("hidden");
    return;
  }
  const groups = {};
  for (const v of data.items) {
    const sid = v.series_id || "_ungrouped";
    (groups[sid] ||= { label: v.series_label || sid, items: [] }).items.push(v);
  }
  const keys = Object.keys(groups).sort((a, b) =>
    (a === "_ungrouped") - (b === "_ungrouped") || (groups[a].label || "").localeCompare(groups[b].label || "", "zh")
  );
  box.innerHTML = keys.map((sid) => {
    const g = groups[sid];
    const rows = g.items.map((v) => `
      <div class="lib-item ${v.video_id === currentId ? "active" : ""}" data-id="${v.video_id}" data-series="${esc(sid)}">
        <div class="t">${esc(v.title || "未命名")}</div>
        <div class="m">${esc(v.duration_label)} · ${v.chapter_count} 章 · ${
          v.status === "ready" ? "就绪" : v.status === "failed" ? "失败" : v.status}</div>
        <button class="ghost del" data-del="${v.video_id}" title="删除课程">×</button>
      </div>`).join("");
    return `<div class="series-head" data-series="${esc(sid)}">${esc(g.label)} · ${g.items.length} 门</div>${rows}`;
  }).join("");

  box.querySelectorAll(".lib-item").forEach((el) => {
    el.onclick = (ev) => {
      if (ev.target.closest("[data-del]")) return;
      openVideo(el.dataset.id);
    };
  });
  box.querySelectorAll("[data-del]").forEach((btn) => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.del;
      if (!confirm(`确定删除课程 ${id}？转写与笔记会一并清除。`)) return;
      try {
        await api(`/api/library/${id}`, { method: "DELETE" });
        if (currentId === id) {
          currentId = null;
          current = null;
          $("video-title").textContent = "未选择课程";
          $("player").removeAttribute("src");
          $("player").load();
        }
        await loadLibrary();
      } catch (e) { alert(e.message); }
    };
  });

  // 当前课所属系列可跨课问
  if (currentSeriesId && groups[currentSeriesId] && groups[currentSeriesId].items.length > 1) {
    $("series-ask-bar").classList.remove("hidden");
  } else if (currentSeriesId) {
    $("series-ask-bar").classList.add("hidden");
  }
}

async function openVideo(id) {
  currentId = id;
  current = await api(`/api/library/${id}`);
  const v = current.video;
  currentSeriesId = (await api("/api/library")).items.find((x) => x.video_id === id)?.series_id || null;
  $("video-title").textContent = v.title || "未命名";
  $("video-duration").textContent = v.duration_label;

  const player = $("player");
  const track = $("subtitle-track");
  // 先卸旧轨，避免换课时叠多条
  track.removeAttribute("src");
  player.src = `/media/${id}`;
  track.src = `/api/subtitles/${id}.vtt`;
  player.load();

  // 续播：有进度且未看完（距结尾 > 5s）则跳回
  const saved = Number(localStorage.getItem(`vedioai.progress.${id}`) || 0);
  const onMeta = () => {
    player.removeEventListener("loadedmetadata", onMeta);
    if (saved > 5 && player.duration && saved < player.duration - 5) {
      player.currentTime = saved;
    }
  };
  player.addEventListener("loadedmetadata", onMeta);

  const list = $("chapters");
  if (!current.chapters.length) {
    list.innerHTML = `<span class="hint">该课程没有章节信息。</span>`;
  } else {
    list.innerHTML = current.chapters.map((c) => `
      <div class="chapter" data-ms="${c.start_ms}">
        <span class="ts">${esc(c.label)}</span>
        <span style="flex:1">
          <div class="tt">${esc(c.title)}</div>
          ${c.summary ? `<div class="sm">${esc(c.summary.slice(0, 220))}</div>` : ""}
        </span>
      </div>`).join("");
    list.querySelectorAll(".chapter").forEach((el) => {
      el.onclick = () => seek(Number(el.dataset.ms));
    });
  }

  await loadTranscript(id);
  $("search-panel").innerHTML = `<span class="hint">输入关键词查找本课转写。</span>`;
  $("search-q").value = "";
  $("fix-bar").classList.remove("show");

  $("chat").innerHTML = "";
  currentSessionId = null;
  await loadSessions(id);
  await loadNotes(id);
  await loadLibrary();
}

async function loadTranscript(videoId) {
  const box = $("transcript");
  try {
    const data = await api(`/api/segments/${videoId}`);
    transcriptSegs = data.items || [];
  } catch (e) {
    transcriptSegs = [];
    box.innerHTML = `<span class="err">${esc(e.message)}</span>`;
    return;
  }
  if (!transcriptSegs.length) {
    box.innerHTML = `<span class="hint">尚无转写。</span>`;
    return;
  }
  box.innerHTML = transcriptSegs.map((s) => `
    <div class="seg-line" data-idx="${s.idx}" data-ms="${s.start_ms}">
      <span class="ts">${esc(s.label)}</span>
      <span class="tx">${esc(s.text)}</span>
    </div>`).join("");
  box.querySelectorAll(".seg-line").forEach((el) => {
    el.onclick = () => seek(Number(el.dataset.ms));
  });
  box.onmouseup = () => maybeOfferFix();
}

function setPlayerTab(name) {
  for (const n of ["chapters", "transcript", "search"]) {
    $(`tab-${n}`).classList.toggle("on", n === name);
    $(`panel-${n}`).classList.toggle("hidden", n !== name);
  }
}

function highlightTranscript(ms) {
  if (!transcriptSegs.length) return;
  let active = null;
  for (const s of transcriptSegs) {
    if (s.start_ms <= ms && ms < (s.end_ms || s.start_ms + 1500)) active = s.idx;
  }
  $("transcript").querySelectorAll(".seg-line").forEach((el) => {
    const on = Number(el.dataset.idx) === active;
    el.classList.toggle("active", on);
    if (on) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
}

function maybeOfferFix() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const text = sel.toString().trim();
  if (!text || text.length > 40 || !currentId) return;
  // 只在转写面板内选中才弹出
  const node = sel.anchorNode && sel.anchorNode.parentElement;
  if (!node || !$("transcript").contains(node)) return;
  $("fix-wrong").textContent = text;
  $("fix-right").value = "";
  $("fix-bar").classList.add("show");
}

async function applyFix() {
  const wrong = $("fix-wrong").textContent.trim();
  const right = $("fix-right").value.trim();
  if (!wrong || !right || !currentId) return;
  try {
    const res = await api("/api/fix", {
      method: "POST",
      body: JSON.stringify({ video_id: currentId, wrong, right }),
    });
    $("fix-bar").classList.remove("show");
    await loadTranscript(currentId);
    const n = Object.values(res.report || {}).reduce((a, b) => a + (typeof b === "number" ? b : 0), 0);
    alert(`已写入术语表并纠正本课文本（约 ${n} 处替换）。`);
  } catch (e) {
    alert(e.message);
  }
}

async function runSearch() {
  const q = $("search-q").value.trim();
  if (!currentId || !q) return;
  const data = await api(`/api/search?video_id=${encodeURIComponent(currentId)}&q=${encodeURIComponent(q)}`);
  const box = $("search-panel");
  if (!data.items.length) {
    box.innerHTML = `<span class="hint">没有命中「${esc(q)}」。</span>`;
    return;
  }
  box.innerHTML = data.items.map((s) => `
    <div class="seg-line" data-ms="${s.start_ms}">
      <span class="ts">${esc(s.label)}</span>
      <span class="tx">${esc(s.text)}</span>
    </div>`).join("");
  box.querySelectorAll(".seg-line").forEach((el) => {
    el.onclick = () => { setPlayerTab("transcript"); seek(Number(el.dataset.ms)); };
  });
}

/* ---------------------------------------------------------------- 入库 */

async function startIngest() {
  const path = $("ingest-path").value.trim();
  if (!path) return;
  $("ingest-error").textContent = "";
  $("btn-ingest").disabled = true;
  try {
    const job = await api("/api/ingest", {
      method: "POST",
      body: JSON.stringify({ path }),
    });
    $("ingest-progress").classList.remove("hidden");
    pollJob(job.job_id, "ingest");
  } catch (e) {
    $("ingest-error").textContent = e.message;
    $("btn-ingest").disabled = false;
  }
}

async function startIngestUpload(file) {
  if (!file) return;
  $("ingest-error").textContent = "";
  $("btn-ingest").disabled = true;
  $("ingest-progress").classList.remove("hidden");
  $("ingest-status").textContent = `上传 ${file.name}…`;
  try {
    const fd = new FormData();
    fd.append("file", file, file.name);
    const resp = await fetch("/api/ingest/upload", { method: "POST", body: fd });
    const job = await resp.json();
    if (!resp.ok) throw new Error(job.detail || `HTTP ${resp.status}`);
    pollJob(job.job_id, "ingest");
  } catch (e) {
    $("ingest-error").textContent = e.message;
    $("btn-ingest").disabled = false;
  }
}

function pollJob(jobId, kind) {
  if (pollTimer) clearInterval(pollTimer);
  const bar = kind === "ingest" ? $("ingest-bar") : $("notes-bar");
  const status = kind === "ingest" ? $("ingest-status") : $("notes-status");
  const box = kind === "ingest" ? $("ingest-progress") : $("notes-progress");
  box.classList.remove("hidden");

  pollTimer = setInterval(async () => {
    let job;
    try { job = await api(`/api/jobs/${jobId}`); }
    catch (e) { clearInterval(pollTimer); return; }

    bar.style.width = `${job.percent}%`;
    status.textContent = `${job.stage || ""} · ${job.message || ""}`;

    if (job.status === "done") {
      clearInterval(pollTimer);
      status.textContent = "完成";
      if (kind === "ingest") {
        $("btn-ingest").disabled = false;
        await loadLibrary();
        const vid = job.result.video_id;
        if (vid) await openVideo(vid);
      } else {
        // 生成完不直接用返回值渲染，而是回磁盘读一遍：
        // 这样面板显示的永远是文件真实内容（含 NotesService 在失败时
        // 保留旧文档的情况），而不是「本次调用以为写出了什么」。
        // 用 job.video_id 而不是 currentId：用户可能在生成期间切了课程。
        const vid = job.video_id || currentId;
        if (vid === currentId) {
          await loadNotes(vid);
          if (notesDoc?.exists) openReader();
        } else {
          flash(`「${$("video-title").textContent}」的文档已生成`);
        }
      }
    } else if (job.status === "failed") {
      clearInterval(pollTimer);
      status.textContent = "失败";
      if (kind === "ingest") {
        $("ingest-error").textContent = job.error || "入库失败";
        $("btn-ingest").disabled = false;
      } else {
        $("notes-status").textContent = `失败：${job.error}`;
      }
    }
  }, 1000);
}

/* ---------------------------------------------------------------- 会话 */

async function loadSessions(videoId, preferId) {
  if (!videoId) return;
  let items = [];
  try {
    const data = await api(`/api/sessions?video_id=${encodeURIComponent(videoId)}`);
    items = data.items || [];
  } catch (e) {
    // 旧服务尚未重启时没有会话接口——降级成无会话的单轮问答，不堵死整页
    $("session-select").innerHTML = `<option value="">（服务需重启后启用会话）</option>`;
    currentSessionId = null;
    $("chat").innerHTML = `<div class="hint">会话功能要等服务重启后生效；现在仍可单轮提问。</div>`;
    return;
  }
  if (!items.length) {
    const created = await api("/api/sessions", {
      method: "POST",
      body: JSON.stringify({ video_id: videoId }),
    });
    items = [created];
  }
  const want = preferId || currentSessionId || items[0].session_id;
  renderSessionSelect(items, want);
  await openSession(want);
}

function renderSessionSelect(items, selectedId) {
  const sel = $("session-select");
  sel.innerHTML = items.map((s) => {
    const label = esc(s.display_title || s.title || "新对话");
    const n = s.message_count || 0;
    return `<option value="${esc(s.session_id)}" ${
      s.session_id === selectedId ? "selected" : ""
    }>${label}${n ? ` · ${n} 条` : ""}</option>`;
  }).join("");
}

async function openSession(sessionId) {
  if (!sessionId) return;
  currentSessionId = sessionId;
  $("chat").innerHTML = "";
  let data;
  try {
    data = await api(`/api/sessions/${encodeURIComponent(sessionId)}`);
  } catch (e) {
    pushMsg("ai", "助手", `<span class="err">加载会话失败：${esc(e.message)}</span>`);
    return;
  }
  const msgs = data.messages || [];
  if (!msgs.length) {
    $("chat").innerHTML = `<div class="hint">这是新对话。提问会保留在这里，刷新后也能回来。</div>`;
    return;
  }
  for (const m of msgs) {
    if (m.role === "user") {
      pushMsg("user", "我", esc(m.content));
    } else {
      renderAssistantMessage(m.content, m.meta || {});
    }
  }
}

function renderAssistantMessage(text, meta) {
  const cites = (meta.citations || []).map((c) => `
    <div class="cite">
      <span class="ts-link" data-ms="${c.start_ms}">[${esc(c.label)}]</span>
      <span class="txt">${esc((c.text || "").slice(0, 90))}…</span>
    </div>`).join("");

  const thumbs = (meta.citations || [])
    .filter((c) => (c.slide_idxs || []).length)
    .slice(0, 4)
    .map((c) => {
      const idx = c.slide_idxs[0];
      return `<img src="/api/slides/${currentId}/${idx}" alt="课件 ${idx}"
        data-ms="${c.start_ms}" data-idx="${idx}" title="课件第 ${idx + 1} 帧 · 点击放大">`;
    })
    .join("");

  const u = meta.usage || {};
  const line = [
    meta.intent ? `意图 ${meta.intent}` : "",
    meta.prefix_tokens != null ? `前缀约 ${meta.prefix_tokens} tokens` : "",
    u.prompt_tokens
      ? `输入 ${u.prompt_tokens}（缓存命中 ${u.cached_tokens ?? 0}，${
          Math.round((u.cache_hit_rate || 0) * 100)}%）`
      : "",
  ].filter(Boolean).join(" · ");

  const div = pushMsg("ai", "助手", md(text));
  if (cites) div.insertAdjacentHTML("beforeend", `<div class="cites">${cites}</div>`);
  if (line) div.insertAdjacentHTML("beforeend", `<div class="meta-line">${line}</div>`);
  if (thumbs) div.insertAdjacentHTML("beforeend", `<div class="thumbs">${thumbs}</div>`);
  return div;
}

function pushMsg(cls, who, bodyHtml, meta) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = `<div class="who">${who}</div><div class="body">${bodyHtml}</div>${
    meta ? `<div class="meta-line">${meta}</div>` : ""}`;
  $("chat").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function ask() {
  const q = $("question").value.trim();
  if (!q) return;
  if (!currentId) { alert("请先选择一门课程"); return; }
  if (!currentSessionId) {
    try {
      const created = await api("/api/sessions", {
        method: "POST",
        body: JSON.stringify({ video_id: currentId }),
      });
      currentSessionId = created.session_id;
      await loadSessions(currentId, currentSessionId);
      $("chat").innerHTML = "";
    } catch (_) { /* 旧服务：继续单轮 */ }
  }

  $("question").value = "";
  const placeholder = $("chat").querySelector(".hint");
  if (placeholder && !$("chat").querySelector(".msg")) placeholder.remove();

  pushMsg("user", "我", esc(q));

  const btn = $("btn-ask");
  btn.disabled = true;
  const pending = pushMsg("ai", "助手", '<span class="hint">…</span>');
  const bodyEl = pending.querySelector(".body");
  let acc = "";

  const body = { video_id: currentId, question: q };
  if (currentSessionId) body.session_id = currentSessionId;
  if ($("use-position").checked && $("player").src) {
    body.current_ms = Math.floor($("player").currentTime * 1000);
  }

  try {
    const resp = await fetch("/api/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let finalAns = null;
    let eventName = "message";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop() || "";
      for (const block of parts) {
        let dataLine = "";
        eventName = "message";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) eventName = line.slice(6).trim();
          if (line.startsWith("data:")) dataLine += line.slice(5).trim();
        }
        if (!dataLine) continue;
        let data;
        try { data = JSON.parse(dataLine); } catch { continue; }
        if (eventName === "delta" && data.text) {
          acc += data.text;
          bodyEl.innerHTML = md(acc);
          pending.scrollIntoView({ behavior: "smooth", block: "end" });
        } else if (eventName === "done") {
          finalAns = data;
        } else if (eventName === "error") {
          throw new Error(data.message || "流式问答失败");
        }
      }
    }

    if (!finalAns) {
      // 降级：非流式
      const ans = await api("/api/ask", { method: "POST", body: JSON.stringify(body) });
      finalAns = ans;
      acc = ans.text || "";
    }

    if (finalAns.session_id) currentSessionId = finalAns.session_id;
    pending.remove();
    renderAssistantMessage(finalAns.text || acc, {
      intent: finalAns.intent,
      citations: finalAns.citations,
      usage: finalAns.usage,
      prefix_tokens: finalAns.prefix_tokens,
    });
    if (finalAns.usage && finalAns.usage.cache_hit_rate === 0) {
      const last = $("chat").lastElementChild;
      last?.insertAdjacentHTML("beforeend",
        `<div class="meta-line">提示：本次未命中上下文缓存。整稿前缀必须保持稳定，否则成本会上升一个数量级。</div>`);
    }
    try {
      const data = await api(`/api/sessions?video_id=${encodeURIComponent(currentId)}`);
      renderSessionSelect(data.items || [], currentSessionId);
    } catch (_) {}
  } catch (e) {
    // 流式失败再试一次非流式
    try {
      const ans = await api("/api/ask", { method: "POST", body: JSON.stringify(body) });
      if (ans.session_id) currentSessionId = ans.session_id;
      pending.remove();
      renderAssistantMessage(ans.text, {
        intent: ans.intent,
        citations: ans.citations,
        usage: ans.usage,
        prefix_tokens: ans.prefix_tokens,
      });
    } catch (e2) {
      pending.querySelector(".body").innerHTML = `<span class="err">${esc(e2.message || e.message)}</span>`;
    }
  } finally {
    btn.disabled = false;
  }
}

async function openReader() {

  // 先显示再建目录：容器还 display:none 时挂 IntersectionObserver，
  // 滚动高亮要等元素可见才首次触发，容易一闪或干脆不亮。
  $("reader").classList.remove("hidden");
  buildToc();
  content.scrollTop = 0;

/** 从 h2/h3 生成目录。h2 是章，h3 是小节。 */
function buildToc() {
  const inner = $("reader-content").querySelector(".inner");
  const toc = $("reader-toc");
  if (!inner) return;

  const heads = [...inner.querySelectorAll("h1, h2, h3")];
  const parts = ['<div class="grp">目录</div>'];
  const seen = {};
  heads.forEach((el, n) => {
    const id = `sec-${n}`;
    el.id = id;
    const level = el.tagName === "H3" ? 2 : 1;
    // 同名标题去重，避免 23 章里多个「本章要点」互相覆盖
    const base = el.textContent.trim().slice(0, 40);
    const text = seen[base] ? `${base} (${++seen[base]})` : ((seen[base] = 1), base);
    parts.push(
      `<a href="#${id}" data-target="${id}" class="${level === 2 ? "sub" : ""}">${esc(text)}</a>`
    );
  });
  toc.innerHTML = parts.join("");

  toc.querySelectorAll("a").forEach((a) => {
    a.onclick = (e) => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.target);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
  spyHeadings(heads);
}

/** 滚动时高亮当前所在章节。 */
let spyObserver = null;
function spyHeadings(heads) {
  if (spyObserver) spyObserver.disconnect();
  const toc = $("reader-toc");
  const links = new Map(
    [...toc.querySelectorAll("a")].map((a) => [a.dataset.target, a])
  );
  spyObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        links.forEach((a) => a.classList.remove("on"));
        const a = links.get(en.target.id);
        if (a) {
          a.classList.add("on");
          a.scrollIntoView({ block: "nearest" });
        }
      });
    },
    { root: $("reader-content"), rootMargin: "0px 0px -75% 0px", threshold: 0 }
  );
  heads.forEach((h) => spyObserver.observe(h));
}

function closeReader() {
  $("reader").classList.add("hidden");
  if (spyObserver) spyObserver.disconnect();
}

let flashTimer = null;
function flash(msg) {
  let el = $("flash");
  if (!el) {
    el = document.createElement("div");
    el.id = "flash";
    el.style.cssText =
      "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;" +
      "background:#1b2434;border:1px solid #2c3b55;color:#e6e9ef;padding:7px 16px;" +
      "border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .3s";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => (el.style.opacity = "0"), 1600);
}

const KIND_LABEL = {
  ask: "问答", notes: "学习文档", summarize: "分层摘要",
  glossary: "术语表", asr: "语音转写", llm: "其他",
};

function yuan(v) {
  // 单次问答常在千分之几元，固定两位小数会全显示成 ¥0.00
  const n = Number(v) || 0;
  if (n === 0) return "¥0";
  if (n < 0.01) return `¥${n.toFixed(4)}`;
  if (n < 1) return `¥${n.toFixed(3)}`;
  return `¥${n.toFixed(2)}`;
}

function usageRow(name, value, warn) {
  return `<div class="usage-row"><span class="n">${esc(name)}</span>
    <span class="v${warn ? " warn" : ""}">${value}</span></div>`;
}

async function loadUsage() {
  let u;
  try {
    u = await api("/api/usage");
  } catch (e) {
    $("usage-global").textContent = `读取失败：${e.message}`;
    return;
  }
  const peak = u.peak_now;
  const tag = `<span class="usage-tag ${peak ? "peak" : ""}">${
    peak ? "当前高峰计价" : "当前闲时计价"}</span>`;

  $("usage-global").innerHTML = `
    <div class="usage-card">
      <div class="usage-big">${yuan(u.cost_yuan)}${tag}</div>
      <div class="hint" style="margin-top:4px">
        累计 ${u.calls} 次调用 · 输入 ${(u.prompt_tokens || 0).toLocaleString()} tokens
        （命中 ${(u.cached_tokens || 0).toLocaleString()}）
      </div>
      ${u.unpriced_calls
        ? `<div class="hint" style="color:var(--warn);margin-top:6px">
             其中 ${u.unpriced_calls} 次调用没有价目，未计入金额——实际花费高于上面这个数</div>`
        : ""}
    </div>`;

  $("usage-kind").innerHTML =
    (u.by_kind || []).map((k) =>
      usageRow(
        KIND_LABEL[k.kind] || k.kind,
        `${yuan(k.cost)} · ${k.calls} 次`,
        !k.cost
      )
    ).join("") || '<div class="hint">暂无记录</div>';

  $("usage-video").innerHTML =
    (u.by_video || []).map((v) => usageRow(v.title || v.video_id, `${yuan(v.cost)} · ${v.calls} 次`)).join("")
    || '<div class="hint">暂无记录</div>';

  const flash = (u.prices || {})["deepseek-flash"] || {};
  const op = flash.off_peak || {}, pk = flash.peak || {};
  $("usage-price").innerHTML = `
    <div class="hint">
      deepseek-flash（元/百万 token）：闲时 命中 ${op.hit} / 未命中 ${op.miss} / 输出 ${op.out}；
      高峰翻倍。<br>
      高峰 = 北京时间工作日 9:00–12:00、14:00–18:00，其余含周末按闲时。<br>
      语音转写按音频时长计费，此处按 ¥${u.asr_yuan_per_hour}/小时 估算；
      官方给录音文件识别 20 小时免费额度，额度内实际不扣费。<br>
      金额为估算值，以控制台账单为准。
    </div>`;

  if (currentId) {
    try {
      const c = await api(`/api/usage?video_id=${encodeURIComponent(currentId)}`);
      $("usage-current").innerHTML = `
        <div class="usage-h">本课程</div>
        <div class="usage-card">
          <div class="usage-big">${yuan(c.cost_yuan)}</div>
          <div class="hint" style="margin-top:4px">${c.calls} 次调用${
            c.calls ? "（" + (c.by_kind || []).map((k) => `${KIND_LABEL[k.kind] || k.kind} ${k.calls}`).join("、") + "）" : ""
          }</div>
        </div>`;
    } catch (e) {
      $("usage-current").innerHTML = "";
    }
  } else {
    $("usage-current").innerHTML = "";
  }
}

const COL_MIN = { lib: 180, ai: 360 };
const COL_MAX = { lib: 420, ai: 900 };

function applyColWidths(lib, ai) {
  const main = document.querySelector("main");
  if (lib != null) main.style.setProperty("--w-lib", `${Math.round(lib)}px`);
  if (ai != null) main.style.setProperty("--w-ai", `${Math.round(ai)}px`);
}

function loadColWidths() {
  try {
    const saved = JSON.parse(localStorage.getItem("vedioai.cols") || "{}");
    applyColWidths(saved.lib || null, saved.ai || null);
  } catch (_) { /* ignore */ }
}

function saveColWidths() {
  const cs = getComputedStyle(document.querySelector("main"));
  const lib = parseFloat(cs.getPropertyValue("--w-lib"));
  const ai = parseFloat(cs.getPropertyValue("--w-ai"));
  localStorage.setItem("vedioai.cols", JSON.stringify({ lib, ai }));
}

function bindSplitter(el, which) {
  el.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const main = document.querySelector("main");
    const startX = e.clientX;
    const cs = getComputedStyle(main);
    const start = parseFloat(cs.getPropertyValue(which === "lib" ? "--w-lib" : "--w-ai"));
    el.classList.add("dragging");
    document.body.classList.add("col-resizing");

    const onMove = (ev) => {
      // 左边拖条：向右拖 → 课程库变宽；右边拖条：向右拖 → AI 变窄（中栏吃掉）
      const delta = ev.clientX - startX;
      let next = which === "lib" ? start + delta : start - delta;
      next = Math.max(COL_MIN[which], Math.min(COL_MAX[which], next));
      // 保证中间栏至少还有约 280px，否则拖过头会把播放器挤没
      const total = main.clientWidth;
      const other = which === "lib"
        ? parseFloat(getComputedStyle(main).getPropertyValue("--w-ai"))
        : parseFloat(getComputedStyle(main).getPropertyValue("--w-lib"));
      const maxForThis = total - other - 5 - 5 - 280;
      next = Math.min(next, Math.max(COL_MIN[which], maxForThis));
      applyColWidths(which === "lib" ? next : null, which === "ai" ? next : null);
    };
    const onUp = () => {
      el.classList.remove("dragging");
      document.body.classList.remove("col-resizing");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveColWidths();
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

loadColWidths();
bindSplitter($("split-lib"), "lib");
bindSplitter($("split-ai"), "ai");

/* ---------------------------------------------------------------- 启动 */

loadHealth();
loadLibrary();
setInterval(loadHealth, 30000);
</script>
