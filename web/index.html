<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vedioAI · 课程视频 AI 理解</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #98a2b3; --accent: #4f8cff; --accent-2: #34d399;
    --warn: #fbbf24; --err: #f87171;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge.ok { color: var(--accent-2); border-color: #1f4d3a; }
  .badge.bad { color: var(--warn); border-color: #4d411f; }

  main {
    display: grid; grid-template-columns: 280px minmax(420px, 1fr) minmax(380px, 460px);
    min-height: 0;
  }
  .col { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); }
  .col:last-child { border-right: none; }
  .col-head {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
  }
  .pad { padding: 12px 14px; }

  input, textarea, button, select {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px;
  }
  input:focus, textarea:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; min-width: 0; }

  .lib-item {
    padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .lib-item:hover { background: var(--panel-2); }
  .lib-item.active { background: #1b2434; border-left: 3px solid var(--accent); }
  .lib-item .t { font-weight: 600; font-size: 13px; }
  .lib-item .m { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .player-wrap { background: #000; }
  video { width: 100%; max-height: 46vh; display: block; background: #000; }
  .player-meta {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  .player-meta strong { color: var(--text); font-size: 13px; font-weight: 600; }

  .chapter {
    display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .chapter:hover { background: var(--panel-2); }
  .chapter .ts { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; flex: 0 0 auto; }
  .chapter .tt { font-size: 13px; }
  .chapter .sm { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: pre-wrap; }

  .msg { padding: 10px 12px; border-radius: var(--radius); margin-bottom: 12px; }
  .msg.user { background: #1b2434; margin-left: 24px; }
  .msg.ai { background: var(--panel-2); }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: .5px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg .body pre {
    background: #0b0e13; padding: 10px; border-radius: 8px; overflow-x: auto;
    border: 1px solid var(--line);
  }
  .msg .body code { background: #0b0e13; padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .meta-line { color: var(--muted); font-size: 11.5px; margin-top: 8px; }

  .ts-link {
    color: var(--accent); cursor: pointer; text-decoration: underline dotted;
    font-variant-numeric: tabular-nums;
  }
  .ts-link:hover { color: #7eaaff; }
  .cites { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .cite { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .cite .txt { color: #c3cad8; }

  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { height: 84px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }

  .progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .status-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .err { color: var(--err); font-size: 12.5px; }
  .notes-out {
    white-space: pre-wrap; background: #0b0e13; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; font-size: 13px; max-height: 40vh; overflow: auto;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 5px 12px; font-size: 12.5px; border-radius: 999px; }
  .tabs button.on { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }

  /* ------------------------------------------------ 渲染后的 Markdown */
  .md { font-size: 14px; }
  .md > *:first-child { margin-top: 0; }
  .md h1 { font-size: 22px; margin: 20px 0 10px; }
  .md h2 { font-size: 18px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 15px; margin: 16px 0 8px; color: #cdd6e4; }
  .md h4, .md h5, .md h6 { font-size: 14px; margin: 12px 0 6px; color: var(--muted); }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote {
    margin: 8px 0; padding: 4px 0 4px 12px; border-left: 3px solid var(--line);
    color: var(--muted);
  }
  .md code { background: #0b0e13; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .md pre {
    background: #0b0e13; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
    border: 1px solid var(--line);
  }
  .md pre code { background: none; padding: 0; }
  .md a { color: var(--accent); }
  .md-table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }
  .md tr:last-child td { border-bottom: none; }
  .md td { min-width: 60px; }
  .md strong { color: #fff; }

  /* 时间标注：`> 时间 00:55` 与表格里的整格时间 */
  .ts-chip {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    background: #1b2434; border: 1px solid #2c3b55; color: var(--accent);
    font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .ts-chip:hover { border-color: var(--accent); color: #7eaaff; }

  /* ------------------------------------------------ 全屏阅读视图 */
  .reader {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: grid; grid-template-rows: auto 1fr;
  }
  .reader-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .reader-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .reader-body {
    display: grid; grid-template-columns: 280px minmax(0, 1fr);
    min-height: 0;
  }
  .reader-toc {
    overflow-y: auto; border-right: 1px solid var(--line);
    padding: 10px 6px 40px; background: var(--panel);
  }
  .reader-toc .grp {
    font-size: 11px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); padding: 10px 10px 4px;
  }
  .reader-toc a {
    display: block; padding: 5px 10px; border-radius: 6px; color: var(--text);
    text-decoration: none; font-size: 12.5px; line-height: 1.4;
    border-left: 2px solid transparent;
  }
  .reader-toc a.sub { padding-left: 22px; color: var(--muted); font-size: 12px; }
  .reader-toc a:hover { background: var(--panel-2); }
  .reader-toc a.on { background: #1b2434; border-left-color: var(--accent); color: #fff; }
  .reader-content { overflow-y: auto; padding: 26px 40px 120px; }
  .reader-content .inner { max-width: 900px; margin: 0 auto; }
  .reader-empty { max-width: 560px; margin: 60px auto; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>vedioAI</h1>
  <span class="hint">课程视频 AI 理解 · 本地转写索引 + 云端问答</span>
  <span class="spacer"></span>
  <span id="badge-asr" class="badge">ASR ?</span>
  <span id="badge-llm" class="badge">LLM ?</span>
  <span id="badge-vision" class="badge">视觉 ?</span>
  <span id="badge-local" class="badge">本地模型 ?</span>
</header>

<main>
  <!-- ---------------------------------------------------------- 课程库 -->
  <section class="col">
    <div class="col-head">课程库</div>
    <div class="pad">
      <div class="row">
        <input id="ingest-path" placeholder="粘贴本地视频完整路径，如 D:\courses\a.mp4" />
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="btn-ingest" style="flex:1">入库</button>
        <button class="ghost" id="btn-refresh" title="刷新">刷新</button>
      </div>
      <div id="ingest-progress" class="hidden" style="margin-top:10px">
        <div class="progress"><i id="ingest-bar"></i></div>
        <div class="status-line" id="ingest-status"></div>
      </div>
      <div id="ingest-error" class="err" style="margin-top:6px"></div>
    </div>
    <div id="library"></div>
  </section>

  <!-- ---------------------------------------------------------- 播放器 -->
  <section class="col">
    <div class="player-wrap">
      <video id="player" controls preload="metadata"></video>
    </div>
    <div class="player-meta">
      <strong id="video-title">未选择课程</strong>
      <span id="video-duration"></span>
      <span class="spacer" style="flex:1"></span>
      <span id="player-clock"></span>
    </div>
    <div class="col-head">章节</div>
    <div id="chapters" class="pad hint">入库完成后显示章节。</div>
  </section>

  <!-- ---------------------------------------------------------- AI 面板 -->
  <section class="col">
    <div class="col-head">
      <span>AI 助手</span>
    </div>
    <div class="pad">
      <div class="tabs" style="margin-bottom:10px">
        <button id="tab-ask" class="on">问答</button>
        <button id="tab-notes">学习文档</button>
      </div>

      <!-- 问答 -->
      <div id="panel-ask">
        <div id="chat"></div>
        <textarea id="question" rows="3" placeholder="就这门课提问，例如：老师讲的三种排序分别是什么？"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary" id="btn-ask" style="flex:1">提问</button>
          <label class="hint" style="display:flex;align-items:center;gap:4px">
            <input type="checkbox" id="use-position" /> 附带当前进度
          </label>
        </div>
      </div>

      <!-- 学习文档 -->
      <div id="panel-notes" class="hidden">
        <p class="hint">按章节分层生成学习笔记（Markdown），每节带时间锚点。</p>
        <button class="primary" id="btn-notes">生成学习文档</button>
        <div class="row" style="margin-top:10px">
          <button class="primary hidden" id="btn-read">全屏阅读</button>
        </div>
        <div id="notes-progress" class="hidden" style="margin-top:10px">
          <div class="progress"><i id="notes-bar"></i></div>
          <div class="status-line" id="notes-status"></div>
        </div>
        <p class="hint" id="notes-empty" style="margin-top:10px"></p>
        <div id="notes-out" class="notes-out hidden" style="margin-top:10px"></div>
      </div>
    </div>
  </section>
</main>

<!-- ------------------------------------------------------------ 阅读视图 -->
<div id="reader" class="reader hidden">
  <div class="reader-head">
    <h2 id="reader-title">学习文档</h2>
    <span class="hint" id="reader-meta"></span>
    <span class="spacer" style="flex:1"></span>
    <button class="ghost" id="reader-regen">重新生成</button>
    <button class="ghost" id="reader-download">下载 Markdown</button>
    <button class="primary" id="reader-close">回到播放器</button>
  </div>
  <div class="reader-body">
    <nav class="reader-toc" id="reader-toc"></nav>
    <div class="reader-content" id="reader-content"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let current = null;       // 当前课程的详情
let currentId = null;
let pollTimer = null;

/* ---------------------------------------------------------------- 工具 */

function fmt(ms) {
  const total = Math.max(0, Math.floor((ms || 0) / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function seek(ms) {
  const v = $("player");
  if (!v.src) return;
  v.currentTime = Math.max(0, ms / 1000);
  v.play().catch(() => {});
  v.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** Markdown 渲染：标题层级、表格、列表、引用、分隔线、代码块、行内格式。
 *
 * 旧实现只把 `#`/`##`/`###` 统统换成 <strong>，于是 23 章文档变成一整块粗体，
 * 468 行表格显示成裸 `|`。笔记这种东西，结构就是内容，不能糊。
 *
 * 顺序很重要：先摘出代码块（免得其中的 `|`、`#` 被当成语法），再按行扫描块级
 * 元素，最后统一处理行内格式。
 */
const TS_RE = /\b(\d{1,3}):([0-5]\d)\b/;

function mdInline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

/** 整格就是一个时间（`| 00:55 |`）时渲染成可点的时间胶囊。 */
function tsChip(text) {
  const m = /^\s*(\d{1,3}):([0-5]\d)\s*$/.exec(text);
  if (!m) return null;
  const ms = (Number(m[1]) * 60 + Number(m[2])) * 1000;
  return `<span class="ts-chip ts-link" data-ms="${ms}">${m[1].padStart(2, "0")}:${m[2]}</span>`;
}

function renderMarkdown(src) {
  const lines = String(src ?? "").replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;

  const splitRow = (row) =>
    row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());

  while (i < lines.length) {
    const line = lines[i];

    // 围栏代码块
    if (/^\s*```/.test(line)) {
      const lang = line.trim().slice(3).trim();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++; // 收尾 ```
      out.push(
        `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ""}>${esc(body.join("\n"))}</code></pre>`
      );
      continue;
    }

    // 表格：当前行是 |...|，下一行是 |---|---|
    if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      const th = head.map((c) => `<th>${mdInline(c)}</th>`).join("");
      const tb = rows
        .map(
          (r) =>
            `<tr>${head
              .map((_, n) => {
                const cell = r[n] ?? "";
                return `<td>${tsChip(cell) ?? mdInline(cell)}</td>`;
              })
              .join("")}</tr>`
        )
        .join("");
      out.push(`<div class="md-table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`);
      continue;
    }

    // 分隔线
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      out.push("<hr>");
      i++;
      continue;
    }

    // 标题
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      const lvl = h[1].length;
      out.push(`<h${lvl}>${mdInline(h[2].trim())}</h${lvl}>`);
      i++;
      continue;
    }

    // 引用：`> 时间 00:55` 特判成时间胶囊（这是笔记里 114 处跳转锚点）
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      const text = buf.join(" ").trim();
      const m = /^时间\s*(.+)$/.exec(text);
      if (m && TS_RE.test(m[1])) {
        out.push(
          m[1]
            .split(/[、,，\s]+/)
            .filter(Boolean)
            .map((t) => {
              const t2 = /^(\d{1,3}):([0-5]\d)$/.exec(t);
              if (!t2) return mdInline(t);
              const ms = (Number(t2[1]) * 60 + Number(t2[2])) * 1000;
              return `<div><span class="ts-chip ts-link" data-ms="${ms}">${t2[1].padStart(2, "0")}:${t2[2]}</span></div>`;
            })
            .join("")
        );
      } else {
        out.push(`<blockquote>${mdInline(text)}</blockquote>`);
      }
      continue;
    }

    // 列表
    if (/^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (
        i < lines.length &&
        (/^\s*[-*+]\s+/.test(lines[i]) || /^\s*\d+[.)]\s+/.test(lines[i]))
      ) {
        items.push(lines[i].replace(/^\s*(?:[-*+]|\d+[.)])\s+/, ""));
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${mdInline(t)}</li>`).join("")}</${tag}>`);
      continue;
    }

    // 空行
    if (!line.trim()) {
      i++;
      continue;
    }

    // 段落（合并到空行或下一个块级起点）
    const para = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^\s*(#{1,6}\s|>|```|\||[-*+]\s|\d+[.)]\s)/.test(lines[i]) &&
      !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])
    ) {
      para.push(lines[i++]);
    }
    out.push(`<p>${mdInline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

/** 兜底：正文里的 [MM:SS] / [时间 MM:SS] 也变成可点时间戳。 */
function linkifyTimestamps(html) {
  return html.replace(/\[(?:时间\s*)?(\d{1,2}:\d{2}(?::\d{2})?)\]/g, (m, ts) => {
    const parts = ts.split(":").map(Number);
    while (parts.length < 3) parts.unshift(0);
    const ms = ((parts[0] * 60 + parts[1]) * 60 + parts[2]) * 1000;
    return `<span class="ts-link" data-ms="${ms}">[${ts}]</span>`;
  });
}

/** 一次到位：渲染 + 时间戳可点。 */
function md(text) {
  return linkifyTimestamps(renderMarkdown(text));
}

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

/* ---------------------------------------------------------------- 健康 */

async function loadHealth() {
  try {
    const h = await api("/api/health");
    const set = (id, ok, label) => {
      const el = $(id);
      el.textContent = `${label} ${ok ? "OK" : "未配置"}`;
      el.className = "badge " + (ok ? "ok" : "bad");
    };
    set("badge-asr", h.asr_ready, "ASR");
    set("badge-llm", h.llm_ready, "LLM");
    set("badge-vision", h.vision_ready, "视觉");
    set("badge-local", h.embedder || h.reranker, "本地模型");
  } catch (e) { /* 服务还没起好 */ }
}

/* ---------------------------------------------------------------- 课程库 */

async function loadLibrary() {
  const data = await api("/api/library");
  const box = $("library");
  if (!data.items.length) {
    box.innerHTML = `<div class="pad hint">课程库为空。粘贴视频路径后点「入库」。</div>`;
    return;
  }
  box.innerHTML = data.items.map((v) => `
    <div class="lib-item ${v.video_id === currentId ? "active" : ""}" data-id="${v.video_id}">
      <div class="t">${esc(v.title || "未命名")}</div>
      <div class="m">${esc(v.duration_label)} · ${v.chapter_count} 章 · ${v.chunk_count} 块 · ${
        v.status === "ready" ? "就绪" : v.status === "failed" ? "失败" : v.status}</div>
    </div>`).join("");
  box.querySelectorAll(".lib-item").forEach((el) => {
    el.onclick = () => openVideo(el.dataset.id);
  });
}

async function openVideo(id) {
  currentId = id;
  current = await api(`/api/library/${id}`);
  const v = current.video;
  $("video-title").textContent = v.title || "未命名";
  $("video-duration").textContent = v.duration_label;
  $("player").src = `/media/${id}`;

  const list = $("chapters");
  if (!current.chapters.length) {
    list.innerHTML = `<span class="hint">该课程没有章节信息。</span>`;
  } else {
    list.innerHTML = current.chapters.map((c) => `
      <div class="chapter" data-ms="${c.start_ms}">
        <span class="ts">${esc(c.label)}</span>
        <span style="flex:1">
          <div class="tt">${esc(c.title)}</div>
          ${c.summary ? `<div class="sm">${esc(c.summary.slice(0, 220))}</div>` : ""}
        </span>
      </div>`).join("");
    list.querySelectorAll(".chapter").forEach((el) => {
      el.onclick = () => seek(Number(el.dataset.ms));
    });
  }
  $("chat").innerHTML = "";
  await loadNotes(id);
  loadLibrary();
}

/* ---------------------------------------------------------------- 入库 */

async function startIngest() {
  const path = $("ingest-path").value.trim();
  if (!path) return;
  $("ingest-error").textContent = "";
  $("btn-ingest").disabled = true;
  try {
    const job = await api("/api/ingest", {
      method: "POST",
      body: JSON.stringify({ path }),
    });
    $("ingest-progress").classList.remove("hidden");
    pollJob(job.job_id, "ingest");
  } catch (e) {
    $("ingest-error").textContent = e.message;
    $("btn-ingest").disabled = false;
  }
}

function pollJob(jobId, kind) {
  if (pollTimer) clearInterval(pollTimer);
  const bar = kind === "ingest" ? $("ingest-bar") : $("notes-bar");
  const status = kind === "ingest" ? $("ingest-status") : $("notes-status");
  const box = kind === "ingest" ? $("ingest-progress") : $("notes-progress");
  box.classList.remove("hidden");

  pollTimer = setInterval(async () => {
    let job;
    try { job = await api(`/api/jobs/${jobId}`); }
    catch (e) { clearInterval(pollTimer); return; }

    bar.style.width = `${job.percent}%`;
    status.textContent = `${job.stage || ""} · ${job.message || ""}`;

    if (job.status === "done") {
      clearInterval(pollTimer);
      status.textContent = "完成";
      if (kind === "ingest") {
        $("btn-ingest").disabled = false;
        await loadLibrary();
        const vid = job.result.video_id;
        if (vid) await openVideo(vid);
      } else {
        // 生成完不直接用返回值渲染，而是回磁盘读一遍：
        // 这样面板显示的永远是文件真实内容（含 NotesService 在失败时
        // 保留旧文档的情况），而不是「本次调用以为写出了什么」。
        // 用 job.video_id 而不是 currentId：用户可能在生成期间切了课程。
        const vid = job.video_id || currentId;
        if (vid === currentId) {
          await loadNotes(vid);
          if (notesDoc?.exists) openReader();
        } else {
          flash(`「${$("video-title").textContent}」的文档已生成`);
        }
      }
    } else if (job.status === "failed") {
      clearInterval(pollTimer);
      status.textContent = "失败";
      if (kind === "ingest") {
        $("ingest-error").textContent = job.error || "入库失败";
        $("btn-ingest").disabled = false;
      } else {
        $("notes-status").textContent = `失败：${job.error}`;
      }
    }
  }, 1000);
}

/* ---------------------------------------------------------------- 问答 */

function pushMsg(cls, who, bodyHtml, meta) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = `<div class="who">${who}</div><div class="body">${bodyHtml}</div>${
    meta ? `<div class="meta-line">${meta}</div>` : ""}`;
  $("chat").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function ask() {
  const q = $("question").value.trim();
  if (!q) return;
  if (!currentId) { alert("请先选择一门课程"); return; }
  $("question").value = "";
  pushMsg("user", "我", esc(q));

  const btn = $("btn-ask");
  btn.disabled = true;
  const pending = pushMsg("ai", "助手", '<span class="hint">思考中…</span>');

  try {
    const body = { video_id: currentId, question: q };
    if ($("use-position").checked && $("player").src) {
      body.current_ms = Math.floor($("player").currentTime * 1000);
    }
    const ans = await api("/api/ask", { method: "POST", body: JSON.stringify(body) });

    const cites = (ans.citations || []).map((c) => `
      <div class="cite">
        <span class="ts-link" data-ms="${c.start_ms}">[${esc(c.label)}]</span>
        <span class="txt">${esc(c.text.slice(0, 90))}…</span>
      </div>`).join("");

    // 引用自带的课件图：接口字段是 slide_idxs（数组），旧代码写的 c.slide_idx
    // 根本不存在，拼出来的 URL 少了索引 → 实测 404，缩略图一直是坏的。
    const thumbs = (ans.citations || [])
      .filter((c) => (c.slide_idxs || []).length)
      .slice(0, 4)
      .map((c) => {
        const idx = c.slide_idxs[0];
        return `<img src="/api/slides/${currentId}/${idx}" alt="课件 ${idx}"
          data-ms="${c.start_ms}" data-idx="${idx}" title="课件第 ${idx + 1} 帧 · 点击放大">`;
      })
      .join("");

    const u = ans.usage || {};
    const meta = `意图 ${ans.intent} · 前缀约 ${ans.prefix_tokens} tokens` +
      (u.prompt_tokens ? ` · 输入 ${u.prompt_tokens}（缓存命中 ${u.cached_tokens ?? 0}，${
        Math.round((u.cache_hit_rate || 0) * 100)}%）` : "");

    pending.querySelector(".body").innerHTML =
      linkifyTimestamps(md(ans.text)) +
      (cites ? `<div class="cites">${cites}</div>` : "");
    pending.querySelector(".meta-line")?.remove();
    pending.insertAdjacentHTML("beforeend", `<div class="meta-line">${meta}</div>`);
    if (thumbs) pending.insertAdjacentHTML("beforeend", `<div class="thumbs">${thumbs}</div>`);
    if (u.cache_hit_rate === 0) {
      pending.insertAdjacentHTML("beforeend",
        `<div class="meta-line">提示：本次未命中上下文缓存。整稿前缀必须保持稳定，否则成本会上升一个数量级。</div>`);
    }
  } catch (e) {
    pending.querySelector(".body").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

/* ---------------------------------------------------------------- 文档 */

let notesDoc = null;   // { exists, markdown, concepts, meta }

async function loadNotes(videoId) {
  try {
    notesDoc = await api(`/api/notes/${videoId}`);
  } catch (e) {
    notesDoc = { exists: false, markdown: "", meta: {} };
  }
  renderNotesPanel();
  return notesDoc;
}

/** 侧栏「学习文档」面板：只放入口与状态，正文交给全屏阅读视图。 */
function renderNotesPanel() {
  const out = $("notes-out");
  const hint = $("notes-empty");
  const openBtn = $("btn-read");
  if (!notesDoc || !notesDoc.exists) {
    out.classList.add("hidden");
    hint.classList.remove("hidden");
    hint.textContent = currentId
      ? "这门课还没有学习文档。点上面「生成学习文档」开始（约 2 分钟）。"
      : "请先选择一门课程。";
    openBtn.classList.add("hidden");
    return;
  }
  hint.classList.add("hidden");
  openBtn.classList.remove("hidden");
  const m = notesDoc.meta || {};
  out.classList.remove("hidden");
  out.textContent =
    `已生成 · ${(m.chars || 0).toLocaleString()} 字 · 更新于 ${m.mtime || "?"}` +
    (m.has_backup ? "\n（磁盘上还留有一份上一版 notes.md.bak）" : "");
}

async function openReader() {
  if (!notesDoc?.exists) return;
  $("reader-title").textContent = current?.video?.title || "学习文档";
  const m = notesDoc.meta || {};
  $("reader-meta").textContent = `${(m.chars || 0).toLocaleString()} 字 · 更新于 ${m.mtime || "?"}`;

  const html = md(notesDoc.markdown);
  const content = $("reader-content");
  content.innerHTML = `<div class="inner md">${html}</div>`;
  // 先显示再建目录：容器还 display:none 时挂 IntersectionObserver，
  // 滚动高亮要等元素可见才首次触发，容易一闪或干脆不亮。
  $("reader").classList.remove("hidden");
  buildToc();
  content.scrollTop = 0;
}

/** 从 h2/h3 生成目录。h2 是章，h3 是小节。 */
function buildToc() {
  const inner = $("reader-content").querySelector(".inner");
  const toc = $("reader-toc");
  if (!inner) return;

  const heads = [...inner.querySelectorAll("h1, h2, h3")];
  const parts = ['<div class="grp">目录</div>'];
  const seen = {};
  heads.forEach((el, n) => {
    const id = `sec-${n}`;
    el.id = id;
    const level = el.tagName === "H3" ? 2 : 1;
    // 同名标题去重，避免 23 章里多个「本章要点」互相覆盖
    const base = el.textContent.trim().slice(0, 40);
    const text = seen[base] ? `${base} (${++seen[base]})` : ((seen[base] = 1), base);
    parts.push(
      `<a href="#${id}" data-target="${id}" class="${level === 2 ? "sub" : ""}">${esc(text)}</a>`
    );
  });
  toc.innerHTML = parts.join("");

  toc.querySelectorAll("a").forEach((a) => {
    a.onclick = (e) => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.target);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
  spyHeadings(heads);
}

/** 滚动时高亮当前所在章节。 */
let spyObserver = null;
function spyHeadings(heads) {
  if (spyObserver) spyObserver.disconnect();
  const toc = $("reader-toc");
  const links = new Map(
    [...toc.querySelectorAll("a")].map((a) => [a.dataset.target, a])
  );
  spyObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        links.forEach((a) => a.classList.remove("on"));
        const a = links.get(en.target.id);
        if (a) {
          a.classList.add("on");
          a.scrollIntoView({ block: "nearest" });
        }
      });
    },
    { root: $("reader-content"), rootMargin: "0px 0px -75% 0px", threshold: 0 }
  );
  heads.forEach((h) => spyObserver.observe(h));
}

function closeReader() {
  $("reader").classList.add("hidden");
  if (spyObserver) spyObserver.disconnect();
}

let flashTimer = null;
function flash(msg) {
  let el = $("flash");
  if (!el) {
    el = document.createElement("div");
    el.id = "flash";
    el.style.cssText =
      "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;" +
      "background:#1b2434;border:1px solid #2c3b55;color:#e6e9ef;padding:7px 16px;" +
      "border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .3s";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => (el.style.opacity = "0"), 1600);
}

async function generateNotes() {
  if (!currentId) { alert("请先选择一门课程"); return; }
  const btn = $("btn-notes");
  btn.disabled = true;
  $("notes-out").classList.add("hidden");
  $("notes-empty").classList.remove("hidden");
  $("notes-empty").textContent = "生成中…";
  try {
    const job = await api("/api/notes", {
      method: "POST",
      body: JSON.stringify({ video_id: currentId }),
    });
    pollJob(job.job_id, "notes");
  } catch (e) {
    $("notes-empty").textContent = e.message;
    $("notes-progress").classList.remove("hidden");
  } finally {
    btn.disabled = false;
  }
}

/* ---------------------------------------------------------------- 绑定 */

$("btn-ingest").onclick = startIngest;
$("btn-refresh").onclick = loadLibrary;
$("btn-ask").onclick = ask;
$("btn-notes").onclick = generateNotes;
$("btn-read").onclick = openReader;
$("reader-close").onclick = closeReader;
$("reader-regen").onclick = () => {
  closeReader();
  $("tab-notes").onclick();
  generateNotes();
};
$("ingest-path").addEventListener("keydown", (e) => { if (e.key === "Enter") startIngest(); });
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
});

$("tab-ask").onclick = () => {
  $("tab-ask").classList.add("on"); $("tab-notes").classList.remove("on");
  $("panel-ask").classList.remove("hidden"); $("panel-notes").classList.add("hidden");
};
$("tab-notes").onclick = () => {
  $("tab-notes").classList.add("on"); $("tab-ask").classList.remove("on");
  $("panel-notes").classList.remove("hidden"); $("panel-ask").classList.add("hidden");
};

/** 下载当前 notes.md。 */
function downloadNotes() {
  if (!notesDoc?.exists) return;
  const blob = new Blob([notesDoc.markdown], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${(current?.video?.title || "notes")}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}
$("reader-download").onclick = downloadNotes;

// 点击任意时间戳（正文 / 胶囊 / 引用）跳转
document.addEventListener("click", (e) => {
  const el = e.target.closest(".ts-link, .ts-chip");
  if (el && el.dataset.ms) {
    const ms = Number(el.dataset.ms);
    // 阅读视图盖住了播放器，点时间戳先关掉它，否则画面被挡住看不见跳转
    if (!$("reader").classList.contains("hidden")) closeReader();
    seek(ms);
    flash(`已跳到 ${fmt(ms)}`);
    return;
  }
  const th = e.target.closest(".thumbs img");
  if (th) {
    // 用服务端接口打开原图；以前 window.open 的是本地文件路径，浏览器打不开
    window.open(`/api/slides/${currentId}/${th.dataset.idx}`, "_blank");
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("reader").classList.contains("hidden")) closeReader();
});

// 播放时间显示
$("player").addEventListener("timeupdate", () => {
  $("player-clock").textContent = fmt($("player").currentTime * 1000);
});

/* ---------------------------------------------------------------- 启动 */

loadHealth();
loadLibrary();
setInterval(loadHealth, 30000);
</script>
